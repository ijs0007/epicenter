name: Update Epicenter Schedule

on:
  schedule:
    # Every Monday at 13:00 UTC (~8:00 AM Central)
    - cron: "0 13 * * 1"
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch schedule, trailers, and RT scores; update index.html
        env:
          # OPTIONAL hardening: add a repo secret named YOUTUBE_API_KEY
          # (Settings -> Secrets and variables -> Actions) and trailer lookup
          # switches from scraping to the official YouTube Data API.
          # Works fine without it.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_schedule.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet index.html; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git config user.name  "epicenter-bot"
          git config user.email "epicenter-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update: schedule / trailers / RT scores ($(date -u +%Y-%m-%d))"
          git push
