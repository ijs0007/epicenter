name: Update Epicenter Schedule

on:
  schedule:
    # Every Tuesday at 13:00 UTC (~8:00 AM Central)
    - cron: "0 13 * * 2"
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater (aborts without touching index.html on any parse problem)
        run: python scripts/update_schedule.py

      - name: Hard gate — generated JavaScript must parse
        run: |
          python - <<'EOF'
          import re
          html = open('index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert blocks, 'no inline script blocks found'
          open('/tmp/app.js', 'w', encoding='utf-8').write('\n'.join(blocks))
          EOF
          node --check /tmp/app.js
          echo "JS syntax OK"

      - name: Hard gate — required app features intact
        run: |
          grep -q "no-cache, no-store, must-revalidate" index.html
          grep -q 'pragma" content="no-cache"' index.html
          grep -q 'expires" content="0"' index.html
          grep -q "modal-trailer-btn" index.html
          ! grep -q "window.open" index.html
          echo "Feature check OK"

      - name: Commit and push if changed
        run: |
          if git diff --quiet index.html; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update: schedule / trailers / RT scores ($(date -u +%F))"
          git push
