<title>Epicenter Theater</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --gold: #c9a84c; --gold-light: #e2c97e; --bg: #0e0e10; --surface: #18181c; --surface2: #212126; --text: #f0ede6; --text-muted: #888; --radius: 12px; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Georgia', serif; -webkit-font-smoothing: antialiased; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px 14px; border-bottom: 1px solid #222; }
  .logo { font-size: 1.7rem; font-weight: 700; color: var(--gold); letter-spacing: -0.5px; font-style: italic; }
  .sub { font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; font-family: 'Helvetica Neue', sans-serif; }
  .price-badge { background: var(--surface2); border: 1px solid #333; border-radius: 999px; padding: 5px 14px; font-size: 0.8rem; color: var(--gold); font-family: 'Helvetica Neue', sans-serif; }
  .date-scroller-wrap { padding: 16px 0 0; border-bottom: 1px solid #222; }
  .date-scroller { display: flex; gap: 10px; overflow-x: auto; padding: 0 20px 14px; scrollbar-width: none; }
  .date-scroller::-webkit-scrollbar { display: none; }
  .date-btn { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 54px; height: 64px; border-radius: 12px; background: var(--surface); border: 1.5px solid transparent; cursor: pointer; transition: all 0.15s; font-family: 'Helvetica Neue', sans-serif; }
  .date-btn:active { transform: scale(0.94); }
  .date-btn.active { background: var(--gold); border-color: var(--gold); }
  .date-btn .dow { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); font-weight: 600; }
  .date-btn.active .dow { color: #3a2d00; }
  .date-btn .dom { font-size: 1.35rem; font-weight: 700; color: var(--text); margin-top: 2px; }
  .date-btn.active .dom { color: #1a1000; }
  .main { padding: 22px 20px 40px; max-width: 600px; margin: 0 auto; }
  .day-heading { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 18px; font-family: 'Helvetica Neue', sans-serif; font-weight: 400; letter-spacing: 0.03em; }
  .show-card { display: flex; align-items: center; gap: 16px; background: var(--surface); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; border: 1px solid #252525; animation: fadeUp 0.25s ease both; transition: border-color 0.18s, background 0.18s; -webkit-tap-highlight-color: transparent; position: relative; overflow: hidden; }
  .show-card:hover { border-color: rgba(201,168,76,0.2); background: #1c1c1f; }
  .show-card:active { transform: scale(0.98); }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .time-block { text-align: center; min-width: 44px; font-family: 'Helvetica Neue', sans-serif; }
  .time-num { font-size: 1.25rem; font-weight: 700; color: var(--gold); line-height: 1; }
  .time-period { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
  .vline { width: 1px; height: 40px; background: #333; flex-shrink: 0; }
  .movie-block { flex: 1; min-width: 0; }
  .movie-title { font-size: 1rem; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 6px; font-family: Georgia, serif; }
  .movie-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: 'Helvetica Neue', sans-serif; }
  .runtime { font-size: 0.75rem; color: var(--text-muted); }
  .rating-badge { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.05em; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; padding: 1px 6px; color: #bbb; text-transform: uppercase; }
  .free-tag { font-size: 0.7rem; font-weight: 700; color: #4caf88; background: rgba(76,175,136,0.12); border-radius: 999px; padding: 2px 9px; }
  .price { font-size: 0.72rem; color: var(--text-muted); }
  .advance-tag { font-size: 0.65rem; font-weight: 700; color: var(--gold); background: rgba(201,168,76,0.12); border-radius: 999px; padding: 2px 9px; }
  .audience-score { font-size: 0.82rem; font-weight: 700; font-family: 'Helvetica Neue', sans-serif; color: #e8c96a; }
  .now-playing-badge { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: #c9a84c; color: #1a1000; border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: middle; font-family: 'Helvetica Neue', sans-serif; white-space: nowrap; }
  @media (orientation: portrait) {
    .movie-title { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
    .movie-title .now-playing-badge { margin-left: 0; }
  }
  @media (orientation: landscape) {
    .movie-title { display: inline; }
    .movie-title .now-playing-badge { margin-left: 6px; }
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0), 0 0 0 2px rgba(201,168,76,0.5); }
    50% { box-shadow: 0 0 14px 3px rgba(201,168,76,0.22), 0 0 0 2px rgba(201,168,76,0.95); }
  }
  @keyframes sweep {
    0% { left: -60%; opacity: 0; }
    10% { opacity: 1; }
    60% { opacity: 0.7; }
    100% { left: 130%; opacity: 0; }
  }
  .show-card.now-playing { animation: pulseGlow 2.2s ease-in-out infinite; border-color: rgba(201,168,76,0.5); }
  .show-card.now-playing::after { content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(201,168,76,0.13), transparent); animation: sweep 3s ease-in-out infinite; }
  .show-card.ended .time-block, .show-card.ended .vline, .show-card.ended .movie-block, .show-card.ended .card-actions { opacity: 0.38; }
  .ended-card-label { font-style: normal; font-size: 0.68rem; color: var(--text-muted); margin-left: 6px; font-family: 'Helvetica Neue', sans-serif; }
  .card-actions { display: flex; flex-direction: row; gap: 8px; flex-shrink: 0; align-items: center; }
  .trailer-btn, .info-btn { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; transition: background 0.15s, border-color 0.15s; -webkit-tap-highlight-color: transparent; }
  .trailer-btn { background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.28); }
  .trailer-btn:hover { background: rgba(201,168,76,0.22); }
  .trailer-btn svg { width: 14px; height: 14px; fill: var(--gold); margin-left: 2px; }
  .info-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); font-family: Georgia, serif; font-style: italic; font-size: 1.1rem; font-weight: 700; color: var(--text-muted); line-height: 1; }
  .info-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); color: var(--text); }
  .status-msg { text-align: center; color: var(--text-muted); padding: 40px 0; font-family: 'Helvetica Neue', sans-serif; }
  .footer { text-align: center; padding: 0 20px 30px; font-size: 0.72rem; color: #444; font-family: 'Helvetica Neue', sans-serif; }
  .footer a { color: #555; text-decoration: underline; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: flex-end; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-sheet { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; transform: translateY(40px); transition: transform 0.3s cubic-bezier(.32,1,.45,1); scrollbar-width: none; }
  .modal-sheet::-webkit-scrollbar { display: none; }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-handle { width: 40px; height: 4px; background: #444; border-radius: 99px; margin: 14px auto 0; }
  .modal-hero { position: relative; width: 100%; overflow: hidden; background: var(--surface2); }
  .modal-hero img { width: 100%; height: auto; display: block; }
  .modal-hero-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 4rem; }
  .modal-hero::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to bottom, transparent, var(--surface)); }
  .modal-hero-title { position: absolute; bottom: 12px; left: 20px; right: 20px; z-index: 2; font-size: 1.4rem; font-weight: 700; font-family: Georgia, serif; color: var(--text); line-height: 1.2; text-shadow: 0 1px 8px rgba(0,0,0,0.6); }
  .modal-close { position: absolute; top: 14px; right: 14px; z-index: 3; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.5); border: none; color: #ccc; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .modal-body { padding: 6px 20px 36px; }
  .modal-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; margin-top: 4px; font-family: 'Helvetica Neue', sans-serif; }
  .chip { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; background: var(--surface2); border: 1px solid #333; border-radius: 999px; padding: 4px 12px; color: var(--text-muted); }
  .chip.gold { background: rgba(201,168,76,0.12); border-color: rgba(201,168,76,0.3); color: var(--gold); }
  .chip.green { background: rgba(76,175,136,0.12); border-color: rgba(76,175,136,0.3); color: #4caf88; }
  .modal-section-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; margin-top: 20px; font-family: 'Helvetica Neue', sans-serif; }
  .modal-synopsis { font-size: 0.92rem; line-height: 1.65; color: #ccc; font-family: Georgia, serif; }
  .modal-cast { font-size: 0.85rem; color: var(--text-muted); line-height: 1.7; font-family: 'Helvetica Neue', sans-serif; }
  .modal-showtimes { display: flex; gap: 8px; flex-wrap: wrap; }
  .modal-showtime-pill { background: var(--surface2); border: 1px solid #333; border-radius: 999px; padding: 6px 14px; font-size: 0.8rem; font-family: 'Helvetica Neue', sans-serif; color: var(--text); }
  .modal-showtime-pill span { color: var(--gold); font-weight: 700; margin-right: 4px; }
  .modal-showtime-pill.past { opacity: 0.38; text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: rgba(255,255,255,0.6); }
  .modal-showtime-pill.past span { color: var(--text-muted); }
  .modal-showtime-pill.now-playing { border-color: rgba(201,168,76,0.6); color: var(--gold); font-weight: 700; }
  .ended-label { font-style: normal; font-size: 0.68rem; color: var(--text-muted); margin-left: 4px; text-decoration: none; display: inline-block; }
  .modal-trailer-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 24px; padding: 14px; background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.3); border-radius: var(--radius); color: var(--gold); font-family: 'Helvetica Neue', sans-serif; font-size: 0.9rem; font-weight: 600; text-decoration: none; letter-spacing: 0.03em; transition: background 0.15s; }
  .modal-trailer-btn:hover { background: rgba(201,168,76,0.18); }
  .modal-trailer-btn svg { width: 12px; height: 12px; fill: var(--gold); }
  .modal-divider { border: none; border-top: 1px solid #2a2a2a; margin: 20px 0 0; }
</style>

    { time: "6:10", period: "PM", title: "Disclosure Day", runtime: "2h 25m", rating: "PG-13", free: false }
  ]}
];

let selected = 0;

function openModal(title) {
  const info = MOVIE_INFO[title];
  if (!info) return;
  const posterEl = document.getElementById('modalPoster');
  if (info.poster) {
    posterEl.innerHTML = `<img src="${info.poster}" alt="${title} poster" onerror="this.parentElement.innerHTML='<div class=\\'modal-hero-fallback\\'>🎬</div>'">`;
  } else {
    posterEl.innerHTML = `<div class="modal-hero-fallback">🎬</div>`;
  }
  document.getElementById('modalTitle').textContent = title;
  const chips = document.getElementById('modalChips');
  const freeInfo = getFreeInfo(title);
  const audienceChip = info.audience !== null ? `<span class="chip">🍿 ${info.audience}% audience</span>` : '';
  chips.innerHTML = `
    <span class="chip gold">${info.rating}</span>
    <span class="chip">${info.runtime}</span>
    <span class="chip">${info.genre}</span>
    <span class="chip">${info.studio}</span>
    ${audienceChip}
    ${freeInfo ? `<span class="chip green">${freeInfo}</span>` : ''}
  `;
  document.getElementById('modalSynopsis').textContent = info.synopsis;
  const castSection = document.getElementById('modalCastSection');
  if (info.cast) { document.getElementById('modalCast').textContent = info.cast; castSection.style.display = ''; }
  else { castSection.style.display = 'none'; }
  const now = new Date();
  const showPills = document.getElementById('modalShowtimes');
  const pills = [];
  schedule.forEach(day => {
    const cutoff = new Date(2026, day.month - 1, parseInt(day.dom) + 1, 3, 0, 0);
    if (cutoff < now) return;
    day.shows.forEach(s => {
      if (s.title !== title) return;
      const [rawHour, rawMin] = s.time.split(':').map(Number);
      const hour24 = (s.period === 'PM' && rawHour !== 12) ? rawHour + 12 : (s.period === 'AM' && rawHour === 12 ? 0 : rawHour);
      const showDate = new Date(2026, day.month - 1, parseInt(day.dom), hour24, rawMin);
      const rtStr2 = info.runtime || '2h 0m';
      const rtHM = rtStr2.match(/(\d+)h/);
      const rtMM = rtStr2.match(/(\d+)m/);
      const rtMins = (rtHM ? parseInt(rtHM[1]) * 60 : 0) + (rtMM ? parseInt(rtMM[1]) : 0);
      const showEnd = new Date(showDate.getTime() + rtMins * 60000);
      const isNP = now >= showDate && now < showEnd;
      const isEnded = now >= showEnd;
      let pillClass = '';
      let suffix = '';
      if (isNP) { pillClass = ' now-playing'; suffix = ' <em class="now-playing-badge" style="font-style:normal">Now Playing</em>'; }
      else if (isEnded) { pillClass = ' past'; suffix = ' <em class="ended-label">ended</em>'; }
      pills.push(`<div class="modal-showtime-pill${pillClass}"><span>${s.time}</span>${s.period} · ${day.date}${suffix}</div>`);
    });
  });
  showPills.innerHTML = pills.length ? pills.join('') : '<div style="color:var(--text-muted);font-size:0.85rem;font-family:\'Helvetica Neue\',sans-serif">No upcoming showtimes.</div>';
  const trailerBtn = document.getElementById('modalTrailerBtn');
  if (info.trailer) { trailerBtn.href = info.trailer; trailerBtn.style.display = 'flex'; }
  else { trailerBtn.style.display = 'none'; }
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function getFreeInfo(title) {
  for (const day of schedule) {
    for (const s of day.shows) {
      if (s.title === title && s.free) return s.advance ? 'Free · Advance Screening' : 'Free';
    }
  }
  return null;
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow = ''; }
function handleOverlayClick(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function init() {
  const today = new Date();
  const todayMonth = today.getMonth() + 1;
  const todayDom = today.getDate();
  let defaultIdx = 0, found = false;
  schedule.forEach((d, i) => {
    if (!found && (d.month > todayMonth || (d.month === todayMonth && parseInt(d.dom) >= todayDom))) { defaultIdx = i; found = true; }
  });
  selected = defaultIdx;
  render();
}

function render() {
  const scroll = document.getElementById('dateScroll');
  scroll.innerHTML = '';
  const nowBtn = new Date();
  schedule.forEach((d, i) => {
    const cutoffBtn = new Date(2026, d.month - 1, parseInt(d.dom) + 1, 3, 0, 0);
    if (cutoffBtn < nowBtn) return;
    const btn = document.createElement('div');
    btn.className = 'date-btn' + (i === selected ? ' active' : '');
    btn.innerHTML = `<span class="dow">${d.dow}</span><span class="dom">${d.dom}</span>`;
    btn.onclick = () => { selected = i; render(); };
    scroll.appendChild(btn);
    if (i === selected) setTimeout(() => btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }), 50);
  });
  const day = schedule[selected];
  document.getElementById('dayHeading').textContent = day.date;
  const list = document.getElementById('showList');
  list.innerHTML = '';
  if (!day.shows || !day.shows.length) { list.innerHTML = '<div class="status-msg">No shows scheduled.</div>'; return; }
  day.shows.forEach((s, idx) => {
    const info = MOVIE_INFO[s.title];
    const trailerUrl = info ? info.trailer : null;
    const now = new Date();
    const [rawHour, rawMin] = s.time.split(':').map(Number);
    const hour24 = (s.period === 'PM' && rawHour !== 12) ? rawHour + 12 : (s.period === 'AM' && rawHour === 12 ? 0 : rawHour);
    const showStart = new Date(2026, day.month - 1, parseInt(day.dom), hour24, rawMin);
    const info2 = MOVIE_INFO[s.title];
    const rtStr = info2 ? info2.runtime : '2h 0m';
    const rtHMatch = rtStr.match(/(\d+)h/);
    const rtMMatch = rtStr.match(/(\d+)m/);
    const runtimeMins = (rtHMatch ? parseInt(rtHMatch[1]) * 60 : 0) + (rtMMatch ? parseInt(rtMMatch[1]) : 0);
    const showEnd = new Date(showStart.getTime() + runtimeMins * 60000);
    const isNowPlaying = now >= showStart && now < showEnd;
    const isEnded = now >= showEnd;

    const card = document.createElement('div');
    card.className = 'show-card' + (isNowPlaying ? ' now-playing' : isEnded ? ' ended' : '');
    card.style.animationDelay = (idx * 0.06) + 's';
    const metaRight = s.free
      ? (s.advance ? '<span class="advance-tag">Advance Screening</span><span class="free-tag">Free</span>' : '<span class="free-tag">Free</span>')
      : '<span class="price">$5.25 mil</span>';
    const audienceHtml = (info && info.audience !== null) ? `<span class="audience-score">🍿 ${info.audience}%</span>` : '';
    const trailerBtnHtml = trailerUrl ? `<a class="trailer-btn" href="${trailerUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${PLAY_ICON}</a>` : '';
    const infoBtnHtml = info ? `<button class="info-btn" onclick="event.stopPropagation(); openModal('${s.title.replace(/'/g, "\\'")}')">i</button>` : '';
    const actionsHtml = (trailerBtnHtml || infoBtnHtml) ? `<div class="card-actions">${trailerBtnHtml}${infoBtnHtml}</div>` : '';
    card.innerHTML = `
      <div class="time-block"><div class="time-num">${s.time}</div><div class="time-period">${s.period}</div></div>
      <div class="vline"></div>
      <div class="movie-block">
        <div class="movie-title">${s.title}${isNowPlaying ? '<span class="now-playing-badge">Now Playing</span>' : isEnded ? '<span class="ended-card-label">ended</span>' : ''}</div>
        <div class="movie-meta">
          <span class="runtime">${s.runtime}</span>
          <span class="rating-badge">${s.rating}</span>
          ${audienceHtml}
          ${metaRight}
        </div>
      </div>
      ${actionsHtml}`;
    list.appendChild(card);
  });
}

init();
</script>
</body>
</html>
