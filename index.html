<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e2c97e;
    --bg: #0e0e10;
    --surface: #18181c;
    --surface2: #212126;
    --text: #f0ede6;
    --text-muted: #888;
    --radius: 12px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px 14px;
    border-bottom: 1px solid #222;
  }
  .logo {
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: -0.5px;
    font-family: Georgia, serif;
    font-style: italic;
  }
  .sub {
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
    font-family: 'Helvetica Neue', sans-serif;
  }
  .price-badge {
    background: var(--surface2);
    border: 1px solid #333;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 0.8rem;
    color: var(--gold);
    font-family: 'Helvetica Neue', sans-serif;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  /* DATE SCROLLER */
  .date-scroll-wrap {
    padding: 16px 0 0;
    border-bottom: 1px solid #222;
  }
  #dateScroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 0 20px 14px;
    scrollbar-width: none;
  }
  #dateScroll::-webkit-scrollbar { display: none; }
  .date-btn {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid #2e2e2e;
    border-radius: 999px;
    padding: 7px 18px;
    font-size: 0.8rem;
    color: var(--text-muted);
    cursor: pointer;
    font-family: 'Helvetica Neue', sans-serif;
    transition: all 0.18s;
    letter-spacing: 0.04em;
  }
  .date-btn:hover { border-color: var(--gold); color: var(--gold-light); }
  .date-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #111;
    font-weight: 700;
  }

  /* MAIN */
  main { padding: 22px 20px 80px; max-width: 560px; margin: 0 auto; }

  .section-title {
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-family: 'Helvetica Neue', sans-serif;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid #1e1e1e;
  }
  .update-note {
    font-size: 0.68rem;
    color: var(--text-muted);
    font-family: 'Helvetica Neue', sans-serif;
    margin-bottom: 18px;
    letter-spacing: 0.02em;
  }
  .update-note a {
    color: var(--gold);
    text-decoration: none;
  }

  /* SHOW CARD */
  .show-card {
    display: flex;
    gap: 14px;
    background: var(--surface);
    border: 1px solid #232323;
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.18s, box-shadow 0.18s;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.3s ease both;
  }
  .show-card:hover { border-color: #3a3a3a; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }

  .show-card.now-playing {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold), 0 4px 24px rgba(201,168,76,0.15);
    animation: fadeUp 0.3s ease both, pulseGlow 2.5s ease-in-out infinite;
  }
  .show-card.now-playing::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 40%, rgba(201,168,76,0.08) 50%, transparent 60%);
    background-size: 200% 100%;
    animation: sweep 3s linear infinite;
    pointer-events: none;
  }
  .show-card.ended {
    opacity: 0.45;
    border-color: #1e1e1e;
  }
  .show-card.ended .time-block,
  .show-card.ended .movie-title,
  .show-card.ended .show-meta,
  .show-card.ended .audience-score { opacity: 0.6; }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 1px var(--gold), 0 4px 24px rgba(201,168,76,0.15); }
    50%       { box-shadow: 0 0 0 1px var(--gold), 0 6px 32px rgba(201,168,76,0.30); }
  }
  @keyframes sweep {
    0%   { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Card inner */
  .poster-wrap { flex-shrink: 0; width: 64px; height: 92px; border-radius: 8px; overflow: hidden; background: #222; }
  .poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }

  .time-block {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--gold-light);
    font-family: 'Helvetica Neue', sans-serif;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .time-ampm { font-size: 0.7rem; font-weight: 400; color: var(--text-muted); margin-left: 2px; }

  .movie-title {
    font-size: 0.97rem;
    font-weight: 700;
    line-height: 1.25;
    margin-top: 5px;
    color: var(--text);
  }
  .show-meta {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-family: 'Helvetica Neue', sans-serif;
    margin-top: 4px;
    letter-spacing: 0.03em;
  }
  .rating-pill {
    display: inline-block;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 0 5px;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-right: 4px;
    vertical-align: middle;
    font-family: 'Helvetica Neue', sans-serif;
  }

  .card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .audience-score {
    font-size: 0.82rem;
    font-weight: 700;
    font-family: 'Helvetica Neue', sans-serif;
    color: #e8c96a;
  }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .now-playing-badge {
    background: var(--gold);
    color: #111;
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 2px 8px;
    font-family: 'Helvetica Neue', sans-serif;
  }
  .ended-card-label {
    font-size: 0.62rem;
    color: var(--text-muted);
    font-family: 'Helvetica Neue', sans-serif;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .advance-tag {
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #9b7fd4;
    border: 1px solid #9b7fd4;
    border-radius: 999px;
    padding: 1px 7px;
    font-family: 'Helvetica Neue', sans-serif;
  }
  .free-tag {
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #5dba78;
    border: 1px solid #5dba78;
    border-radius: 999px;
    padding: 1px 7px;
    font-family: 'Helvetica Neue', sans-serif;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.82);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.visible { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 560px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 28px 22px 44px;
    transform: translateY(30px);
    transition: transform 0.25s ease;
    scrollbar-width: none;
  }
  .modal::-webkit-scrollbar { display: none; }
  .modal-overlay.visible .modal { transform: translateY(0); }

  .modal-close {
    position: sticky; top: 0;
    display: flex; justify-content: flex-end;
    margin-bottom: 16px;
    background: var(--surface);
    padding-bottom: 4px;
    z-index: 1;
  }
  .close-btn {
    background: #2a2a2a;
    border: none;
    color: var(--text-muted);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .close-btn:hover { background: #3a3a3a; color: var(--text); }

  .modal-top { display: flex; gap: 18px; margin-bottom: 20px; }
  .modal-poster { width: 90px; height: 130px; border-radius: 10px; overflow: hidden; background: #222; flex-shrink: 0; }
  .modal-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-info { flex: 1; min-width: 0; }
  .modal-title { font-size: 1.15rem; font-weight: 700; line-height: 1.25; margin-bottom: 6px; }
  .modal-meta { font-size: 0.75rem; color: var(--text-muted); font-family: 'Helvetica Neue', sans-serif; line-height: 1.6; }
  .modal-audience { font-size: 0.9rem; font-weight: 700; color: #e8c96a; font-family: 'Helvetica Neue', sans-serif; margin-top: 8px; }

  .modal-section { margin-bottom: 16px; }
  .modal-label {
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-family: 'Helvetica Neue', sans-serif;
    margin-bottom: 5px;
    font-weight: 700;
  }
  .modal-text { font-size: 0.88rem; line-height: 1.65; color: #c8c4bc; }
  .modal-cast { font-size: 0.82rem; color: #b0ac9e; font-family: 'Helvetica Neue', sans-serif; line-height: 1.7; }

  /* Showtimes in modal */
  .modal-showtimes { display: flex; flex-wrap: wrap; gap: 8px; }
  .modal-showtime-pill {
    background: var(--surface2);
    border: 1px solid #2e2e2e;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 0.8rem;
    font-family: 'Helvetica Neue', sans-serif;
    color: var(--text);
    font-weight: 600;
  }
  .modal-showtime-pill.current {
    border-color: var(--gold);
    color: var(--gold);
  }
  .modal-showtime-pill.past {
    opacity: 0.38;
    text-decoration: line-through;
  }

  .modal-trailer-btn {
    display: block;
    margin-top: 22px;
    background: var(--gold);
    color: #111;
    text-align: center;
    font-family: 'Helvetica Neue', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 14px 0;
    text-decoration: none;
    transition: background 0.15s, transform 0.1s;
  }
  .modal-trailer-btn:active { transform: scale(0.98); }
  .modal-trailer-btn:hover { background: var(--gold-light); }

  .no-shows {
    text-align: center;
    padding: 60px 0;
    color: var(--text-muted);
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 0.9rem;
  }
</style>
</head>

// ─── APP LOGIC ───────────────────────────────────────────────────────────────

function parseRuntime(rt) {
  if (!rt) return 0;
  const m = rt.match(/(\d+)h\s*(\d+)m/);
  if (m) return parseInt(m[1]) * 60 + parseInt(m[2]);
  const m2 = rt.match(/(\d+)h/);
  if (m2) return parseInt(m2[1]) * 60;
  const m3 = rt.match(/(\d+)m/);
  if (m3) return parseInt(m3[1]);
  return 0;
}

function parseShowDateTime(dateStr, timeStr) {
  const [year, month, day] = dateStr.split('-').map(Number);
  const m = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!m) return null;
  let h = parseInt(m[1]), min = parseInt(m[2]);
  const ampm = m[3].toUpperCase();
  if (ampm === 'PM' && h !== 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  return new Date(year, month - 1, day, h, min, 0);
}

function getShowState(dateStr, timeStr, movieId) {
  const now = new Date();
  const info = MOVIE_INFO[movieId];
  const runtime = info ? parseRuntime(info.runtime) : 120;
  const start = parseShowDateTime(dateStr, timeStr);
  if (!start) return 'upcoming';
  const end = new Date(start.getTime() + runtime * 60 * 1000);
  if (now >= start && now < end) return 'now-playing';
  if (now >= end) return 'ended';
  return 'upcoming';
}

function formatDateLabel(dateStr) {
  const [y, mo, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, mo - 1, d);
  const today = new Date();
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  if (dt.toDateString() === today.toDateString()) return 'Today';
  if (dt.toDateString() === tomorrow.toDateString()) return 'Tomorrow';
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function shouldShowDate(dateStr) {
  const now = new Date();
  const [y, mo, d] = dateStr.split('-').map(Number);
  // Hide date at 3am the following day
  const cutoff = new Date(y, mo - 1, d + 1, 3, 0, 0);
  return now < cutoff;
}

let selectedDate = null;
let currentModalMovieId = null;
let currentModalDate = null;

function buildDateScroll() {
  const container = document.getElementById('dateScroll');
  container.innerHTML = '';
  const visible = schedule.filter(d => shouldShowDate(d.date));
  if (!visible.length) return;

  // Auto-select today or first future date
  const today = new Date().toISOString().slice(0, 10);
  const defaultDate = visible.find(d => d.date >= today)?.date || visible[0].date;
  if (!selectedDate || !visible.find(d => d.date === selectedDate)) {
    selectedDate = defaultDate;
  }

  visible.forEach(day => {
    const btn = document.createElement('button');
    btn.className = 'date-btn' + (day.date === selectedDate ? ' active' : '');
    btn.textContent = formatDateLabel(day.date);
    btn.addEventListener('click', () => {
      selectedDate = day.date;
      buildDateScroll();
      buildShowList();
    });
    container.appendChild(btn);
  });
}

function buildShowList() {
  const container = document.getElementById('showList');
  container.innerHTML = '';

  const day = schedule.find(d => d.date === selectedDate);
  if (!day || !day.shows.length) {
    container.innerHTML = '<p class="no-shows">No shows scheduled for this day.</p>';
    return;
  }

  const label = document.createElement('div');
  label.className = 'section-title';
  label.textContent = `${day.dow} · ${formatDateLabel(day.date)}`.toUpperCase();
  container.appendChild(label);

  day.shows.forEach((show, i) => {
    const info = MOVIE_INFO[show.id];
    if (!info) return;
    const state = getShowState(day.date, show.time, show.id);

    const card = document.createElement('div');
    card.className = 'show-card';
    if (state === 'now-playing') card.classList.add('now-playing');
    if (state === 'ended') card.classList.add('ended');
    card.style.animationDelay = `${i * 0.06}s`;

    // Parse time for display
    const timeParts = show.time.match(/(\d+:\d+)\s*(AM|PM)/i);
    const timeNum = timeParts ? timeParts[1] : show.time;
    const timeAmPm = timeParts ? timeParts[2] : '';

    // Bottom tags
    let bottomLeft = '';
    if (state === 'now-playing') {
      bottomLeft = `<span class="now-playing-badge">Now Playing</span>`;
    } else if (state === 'ended') {
      bottomLeft = `<span class="ended-card-label">Ended</span>`;
    } else {
      const extras = [];
      if (show.advance) extras.push(`<span class="advance-tag">Advance</span>`);
      if (show.free) extras.push(`<span class="free-tag">Free</span>`);
      bottomLeft = extras.join('');
    }

    const audienceHtml = info.audience !== null && info.audience !== undefined
      ? `<span class="audience-score">🍿 ${info.audience}%</span>`
      : '';

    card.innerHTML = `
      <div class="poster-wrap">
        <img src="${info.poster}" alt="${info.title}" loading="lazy" onerror="this.style.display='none'">
      </div>
      <div class="card-body">
        <div>
          <div class="time-block">${timeNum}<span class="time-ampm">${timeAmPm}</span></div>
          <div class="movie-title">${info.title}</div>
          <div class="show-meta"><span class="rating-pill">${info.rating}</span>${info.runtime} &middot; ${info.genre}</div>
        </div>
        <div class="card-bottom">
          <div class="tags">${bottomLeft}</div>
          ${audienceHtml}
        </div>
      </div>
    `;

    card.addEventListener('click', () => openModal(show.id, day.date));
    container.appendChild(card);
  });
}

function openModal(movieId, dateStr) {
  currentModalMovieId = movieId;
  currentModalDate = dateStr;
  const info = MOVIE_INFO[movieId];
  if (!info) return;

  document.getElementById('modalPoster').src = info.poster;
  document.getElementById('modalPoster').alt = info.title;
  document.getElementById('modalTitle').textContent = info.title;
  document.getElementById('modalMeta').innerHTML =
    `<span class="rating-pill">${info.rating}</span> ${info.runtime} &middot; ${info.genre}<br>${info.studio} &middot; ${info.released}`;
  document.getElementById('modalAudience').textContent =
    info.audience !== null && info.audience !== undefined ? `🍿 ${info.audience}% Audience Score` : '';
  document.getElementById('modalSynopsis').textContent = info.synopsis;
  document.getElementById('modalCast').textContent = info.cast;

  // All showtimes for this movie across all dates
  const allShowtimes = [];
  schedule.forEach(day => {
    if (!shouldShowDate(day.date)) return;
    day.shows.forEach(s => {
      if (s.id === movieId) {
        allShowtimes.push({ date: day.date, dow: day.dow, time: s.time });
      }
    });
  });

  const showtimesEl = document.getElementById('modalShowtimes');
  showtimesEl.innerHTML = '';
  allShowtimes.forEach(st => {
    const state = getShowState(st.date, st.time, movieId);
    const pill = document.createElement('div');
    pill.className = 'modal-showtime-pill';
    if (state === 'now-playing') pill.classList.add('current');
    if (state === 'ended') pill.classList.add('past');
    const label = formatDateLabel(st.date);
    pill.textContent = `${label} ${st.time}`;
    showtimesEl.appendChild(pill);
  });

  const trailerUrl = TRAILERS[movieId] || '#';
  document.getElementById('modalTrailerBtn').href = trailerUrl;

  document.getElementById('modalOverlay').classList.add('visible');
  document.getElementById('modal').scrollTop = 0;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('visible');
}

document.getElementById('closeBtn').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Init
buildDateScroll();
buildShowList();

// Refresh state every 30 seconds (for now-playing / ended transitions)
setInterval(() => {
  buildDateScroll();
  buildShowList();
}, 30000);
</script>
